<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanças" />
  <title>Finanças</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #1c1c1e; --surface2: #2a2a2c;
      --border: rgba(255,255,255,0.07); --text: #f5f5f7; --muted: #8a8a8e; --muted2: #636366;
      --green: #34c759; --red: #ff453a; --blue: #6c63ff; --blue-soft: #7d76ff;
      --radius: 16px; --radius-sm: 10px;
      --pad: 24px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px; min-height: 100dvh; -webkit-font-smoothing: antialiased;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    main { padding: 0; max-width: 640px; margin: 0 auto; }
    .screen { display: none; padding: 0 var(--pad); }
    .screen.active { display: block; }

    .month-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 28px;
    }
    .month-bar button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; transition: color 0.15s; line-height: 1; border-radius: 50%;
    }
    .month-bar button:hover { color: var(--text); }
    .month-bar button:disabled { opacity: 0.25; cursor: default; }
    .month-label { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }

    .pessoa-select { position: relative; margin-bottom: 36px; }
    .pessoa-trigger {
      display: flex; align-items: center; gap: 12px; cursor: pointer;
      background: none; border: none; color: var(--text); font-family: inherit; padding: 0;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .pessoa-trigger .nome { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    .pessoa-trigger .chev { color: var(--muted); transition: transform 0.2s; display: flex; }
    .pessoa-trigger.open .chev { transform: rotate(180deg); }
    .pessoa-menu {
      position: absolute; top: 54px; left: 0; z-index: 30;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 6px; min-width: 180px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none;
    }
    .pessoa-menu.show { display: block; }
    .pessoa-option {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500;
      transition: background 0.12s;
    }
    .pessoa-option:hover { background: var(--surface2); }
    .pessoa-option.sel { color: var(--blue-soft); }
    .pessoa-option .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted2); }
    .pessoa-option.sel .dot { background: var(--blue); }

    .saldo-block { margin-bottom: 8px; }
    .saldo-block .eyebrow {
      font-size: 13px; color: var(--muted); letter-spacing: 0.8px;
      text-transform: uppercase; margin-bottom: 8px; font-weight: 500;
    }
    .saldo-block .amount { font-size: 40px; font-weight: 700; letter-spacing: -1.5px; }
    .saldo-block .amount.pos { color: var(--text); }
    .saldo-block .amount.neg { color: var(--red); }

    .consolidado-row { text-align: right; margin: 12px 0 20px; min-height: 20px; }
    .consolidado-link {
      font-size: 14px; color: var(--muted); cursor: pointer; transition: color 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .consolidado-link:hover { color: var(--text); }
    .consolidado-link.ativo { color: var(--blue-soft); }

    .card {
      background: var(--surface); border-radius: var(--radius);
      padding: 20px; margin-bottom: 14px;
    }
    .card .card-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .card .card-label {
      font-size: 13px; color: var(--muted); letter-spacing: 0.8px;
      text-transform: uppercase; font-weight: 500;
    }
    .card .card-amount { font-size: 24px; font-weight: 700; letter-spacing: -0.8px; }
    .icon-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }
    .icon-btn svg { width: 18px; height: 18px; }
    .card-amount.green { color: var(--green); }
    .card-amount.red { color: var(--red); }
    .card-amount.blue { color: var(--blue-soft); }

    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .duo .card { min-width: 0; }
    .duo .card-amount {
      font-size: clamp(15px, 5vw, 20px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-sub { font-size: 12px; color: var(--muted2); margin-top: 6px; }

    .form-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
    .seg { display: flex; gap: 8px; }
    .seg-btn {
      flex: 1; padding: 13px 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; font-family: inherit; text-align: center;
    }
    .seg-btn.on-entrada { background: rgba(52,199,89,0.12); color: var(--green); border-color: rgba(52,199,89,0.3); }
    .seg-btn.on-saida { background: rgba(255,69,58,0.12); color: var(--red); border-color: rgba(255,69,58,0.3); }
    .seg-btn.on-invest { background: rgba(108,99,255,0.14); color: var(--blue-soft); border-color: rgba(108,99,255,0.35); }
    select, input[type=text], input[type=number] {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-size: 16px;
      padding: 14px 16px; outline: none; transition: border-color 0.15s; -webkit-appearance: none;
      font-family: inherit;
    }
    select:focus, input:focus { border-color: var(--blue); }
    select { cursor: pointer; }
    .btn-primary {
      width: 100%; padding: 16px; border-radius: var(--radius-sm); border: none;
      background: var(--blue); color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: opacity 0.15s, transform 0.05s; font-family: inherit;
    }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .filter-row { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.15s; font-family: inherit;
    }
    .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .empty { text-align: center; color: var(--muted2); font-size: 14px; padding: 60px 20px; }
    .empty span { display: block; font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
    .tx { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .tx:last-child { border-bottom: none; }
    .tx-dot { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .tx-dot.entrada { background: rgba(52,199,89,0.12); color: var(--green); }
    .tx-dot.saida { background: rgba(255,69,58,0.12); color: var(--red); }
    .tx-dot.invest { background: rgba(108,99,255,0.14); color: var(--blue-soft); }
    .tx-body { flex: 1; min-width: 0; }
    .tx-desc { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 7px; }
    .tx-pessoa { font-size: 10px; padding: 1px 8px; border-radius: 10px; background: rgba(108,99,255,0.15); color: var(--blue-soft); font-weight: 600; }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-val { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .tx-val.entrada { color: var(--green); }
    .tx-val.saida { color: var(--red); }
    .tx-val.invest { color: var(--blue-soft); }
    .tx-date { font-size: 11px; color: var(--muted2); margin-top: 2px; }
    .tx-del { background: none; border: none; color: #3a3a3c; cursor: pointer; font-size: 20px; padding: 4px; flex-shrink: 0; transition: color 0.15s; }
    .tx-del:hover { color: var(--red); }
    .loading { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }

    .sec { margin-bottom: 28px; }
    .sec h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; font-weight: 500; }
    .line { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
    .line:last-child { border-bottom: none; }
    .bar-wrap { width: 100%; background: var(--surface2); border-radius: 4px; height: 5px; margin-top: 7px; }
    .bar { height: 5px; border-radius: 4px; background: var(--red); }

    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      display: flex; background: rgba(18,18,20,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 0 10px; background: none; border: none; color: var(--muted2);
      cursor: pointer; transition: color 0.15s; font-family: inherit;
    }
    .tab svg { width: 24px; height: 24px; stroke-width: 1.8; }
    .tab span { font-size: 10px; font-weight: 500; }
    .tab.active { color: var(--text); }
    .tab.add-tab.active { color: var(--blue-soft); }
  </style>
</head>
<body>

<main>

  <!-- ===== HOME ===== -->

  <!-- ===== EXTRATO ===== -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, getDoc, setDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDws4F_Jb-5ZvB92MN_hDJyYnh9Y76h4-8",
  authDomain: "financas-4ecdd.firebaseapp.com",
  projectId: "financas-4ecdd",
  storageBucket: "financas-4ecdd.firebasestorage.app",
  messagingSenderId: "655131184307",
  appId: "1:655131184307:web:7320f622b038f9eb82f4c6",
  measurementId: "G-R66VLQ12K3"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// tipos internos: 'entrada' (receita), 'saida' (gasto), 'investimento'
const CATS = {
  saida: ['Moradia','Celulares','Alimentação','Transporte','Saúde','Lazer','Assinaturas','Cartão de crédito','Pix','Vestuário','Estorno/Golpe','Outros'],
  entrada: ['Salário','Pix','Resgate Cofrinho','Vale alimentação','Vale home office','Freela','Outros'],
  investimento: ['Tesouro Direto','CDB','FII','Ações','Cofrinho Itaú','Outros']
};
const ICONS = { entrada: '↑', saida: '↓', investimento: '→' };
const DOTCLASS = { entrada: 'entrada', saida: 'saida', investimento: 'invest' };

let tipoAtivo = 'saida';
let pessoaLanc = 'Franklin';
let pessoaFiltro = 'Franklin';
let filtroTipo = 'todos';
let screenAtiva = 'home';
let consolidado = false;
let mesAtual = new Date(); mesAtual.setDate(1);
let items = [];
let todosItems = [];
let patrimonio = null;        // saldo real investido (informado pelo usuário)
let patrimonioAtualizadoEm = null;
let totalAportado = 0;        // soma de TODOS os investimentos (aportes - resgates), todo o histórico

// Converte qualquer valor (number, string "1.234,56" ou "1234.56") em número seguro.
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (typeof v === 'string') {
    let s = v.trim();
    // formato brasileiro: remove pontos de milhar e troca vírgula decimal
    if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  return 0;
}
function fmt(v) { return 'R$ ' + num(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function mesKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function mesLabel(d) { return cap(d.toLocaleDateString('pt-BR', { month: 'long' })) + '/' + d.getFullYear(); }
function dataFmt(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
// compat: dados antigos usavam 'receita'/'gasto'
function normTipo(t) {
  if (t === 'receita') return 'entrada';
  if (t === 'gasto') return 'saida';
  return t;
}

// Categorias que NÃO contam como gasto real (ex: estorno de golpe/fraude).
// Ficam visíveis no extrato, mas são excluídas de saldo, totais e gráficos.
const CATS_NEUTRAS = ['Estorno/Golpe'];
function ehNeutra(i) { return CATS_NEUTRAS.includes(i.categoria); }

// Totaliza uma lista por tipo, sempre como número. Ignora categorias neutras.
function totaisPorTipo(lista) {
  const t = { entrada: 0, saida: 0, investimento: 0 };
  lista.forEach(i => {
    if (ehNeutra(i)) return;
    const tp = normTipo(i.tipo);
    if (t[tp] === undefined) return;
    t[tp] += num(i.valor);
  });
  return t;
}

// ===== MÊS =====
window.mudarMes = function(delta) {
  if (consolidado) return;
  mesAtual.setMonth(mesAtual.getMonth() + delta);
  atualizarMesLabels();
  carregarItems();
};
function atualizarMesLabels() {
  const l = mesLabel(mesAtual);
  ['home','extrato','add'].forEach(s => {
    const el = document.getElementById('ml-' + s);
    if (el) el.textContent = l;
  });
}

// ===== PESSOA DROPDOWN (Home) =====
window.togglePessoaMenu = function(e) {
  e.stopPropagation();
  document.getElementById('pessoa-menu').classList.toggle('show');
  document.getElementById('pessoa-trigger').classList.toggle('open');
};
document.addEventListener('click', () => {
  document.getElementById('pessoa-menu').classList.remove('show');
  document.getElementById('pessoa-trigger').classList.remove('open');
});
window.setPessoaFiltro = function(p) {
  pessoaFiltro = p;
  document.getElementById('pessoa-nome').textContent = p;
  document.getElementById('avatar').textContent = p === 'Todos' ? '∑' : p[0];
  document.querySelectorAll('.pessoa-option').forEach(o => {
    o.classList.toggle('sel', o.textContent.trim() === p);
  });
  renderHome();
  renderCategoriasHome();
};

// ===== TIPO / PESSOA (Adicionar) =====
window.setTipo = function(t) {
  tipoAtivo = t;
  const map = { saida: 'on-saida', entrada: 'on-entrada', investimento: 'on-invest' };
  ['saida','entrada','investimento'].forEach(x => {
    document.getElementById('seg-'+x).className = 'seg-btn' + (x===t ? ' '+map[x] : '');
  });
  const sel = document.getElementById('add-categoria');
  sel.innerHTML = CATS[t].map(c => `<option>${c}</option>`).join('');
};
window.setPessoaLanc = function(p) {
  pessoaLanc = p;
  ['Franklin','Airton'].forEach(x => {
    document.getElementById('seg-'+x).className = 'seg-btn' + (x===p ? ' on-invest' : '');
  });
};

// ===== CONSOLIDADO =====
window.toggleConsolidado = async function() {
  consolidado = !consolidado;
  const link = document.getElementById('consolidado-link');
  const monthBar = document.getElementById('home-month-bar');
  if (consolidado) {
    link.textContent = 'Ver por mês';
    link.classList.add('ativo');
    monthBar.style.opacity = '0.3';
    monthBar.style.pointerEvents = 'none';
    try {
      const snap = await getDocs(collection(db, 'lancamentos'));
      todosItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) { console.error(e); todosItems = []; }
  } else {
    link.textContent = 'Ver consolidado';
    link.classList.remove('ativo');
    monthBar.style.opacity = '1';
    monthBar.style.pointerEvents = 'auto';
  }
  renderHome();
  renderCategoriasHome();
};

// ===== ADD / DELETE =====
window.addItem = async function() {
  const desc = document.getElementById('add-desc').value.trim();
  const valor = num(document.getElementById('add-valor').value);
  const cat = document.getElementById('add-categoria').value;
  if (!desc || valor <= 0) { alert('Preencha descrição e um valor maior que zero.'); return; }
  const btn = document.getElementById('btn-add');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    await addDoc(collection(db, 'lancamentos'), {
      tipo: tipoAtivo, categoria: cat, descricao: desc, valor: valor,
      pessoa: pessoaLanc, mes: mesKey(mesAtual), criadoEm: new Date()
    });
    document.getElementById('add-desc').value = '';
    document.getElementById('add-valor').value = '';
    if (tipoAtivo === 'investimento') await carregarTotalAportado();
    await carregarItems();
    setScreen('home', document.getElementById('tab-home'));
  } catch(e) { alert('Erro ao salvar. Verifique sua conexão.'); console.error(e); }
  btn.disabled = false; btn.textContent = 'Adicionar lançamento';
};
window.delItem = async function(id) {
  if (!confirm('Remover este lançamento?')) return;
  try {
    await deleteDoc(doc(db, 'lancamentos', id));
    if (consolidado) {
      const snap = await getDocs(collection(db, 'lancamentos'));
      todosItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    await carregarTotalAportado();
    await carregarItems();
  } catch(e) { alert('Erro ao remover.'); console.error(e); }
};

// ===== PATRIMÔNIO (saldo real investido) =====
async function carregarTotalAportado() {
  try {
    const snap = await getDocs(collection(db, 'lancamentos'));
    totalAportado = snap.docs.reduce((s, d) => {
      const i = d.data();
      return normTipo(i.tipo) === 'investimento' ? s + num(i.valor) : s;
    }, 0);
  } catch(e) { console.error('Erro ao somar aportes:', e); totalAportado = 0; }
}
async function carregarPatrimonio() {
  try {
    const d = await getDoc(doc(db, 'config', 'patrimonio'));
    if (d.exists()) {
      patrimonio = num(d.data().valor);
      const upd = d.data().atualizadoEm;
      patrimonioAtualizadoEm = upd ? (upd.toDate ? upd.toDate() : new Date(upd)) : null;
    }
  } catch(e) { console.error('Erro ao carregar patrimônio:', e); }
}
window.editarPatrimonio = async function() {
  const atual = patrimonio != null ? patrimonio.toLocaleString('pt-BR', {minimumFractionDigits:2}) : '';
  const novo = prompt('Saldo real investido hoje (R$):\n(inclui rendimentos — veja no app do banco)', atual);
  if (novo === null) return;
  const v = num(novo);
  if (v < 0) { alert('Valor inválido.'); return; }
  try {
    await setDoc(doc(db, 'config', 'patrimonio'), { valor: v, atualizadoEm: new Date() });
    patrimonio = v;
    patrimonioAtualizadoEm = new Date();
    renderHome();
  } catch(e) { alert('Erro ao salvar.'); console.error(e); }
};

// ===== LOAD =====
async function carregarItems() {
  try {
    const mk = mesKey(mesAtual);
    const q = query(collection(db, 'lancamentos'), where('mes', '==', mk));
    const snap = await getDocs(q);
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    items.sort((a, b) => {
      const ta = a.criadoEm?.toDate ? a.criadoEm.toDate() : new Date(a.criadoEm || 0);
      const tb = b.criadoEm?.toDate ? b.criadoEm.toDate() : new Date(b.criadoEm || 0);
      return tb - ta;
    });
  } catch(e) { console.error('Erro ao carregar:', e); items = []; }
  renderTudo();
}

// ===== RENDER =====
function renderTudo() { renderHome(); renderExtrato(); renderCategoriasHome(); }

function filtrarPorPessoa(lista) {
  if (pessoaFiltro === 'Todos') return lista;
  return lista.filter(i => (i.pessoa || 'Franklin') === pessoaFiltro);
}

function renderHome() {
  // base respeita a pessoa selecionada, inclusive no modo consolidado
  let base = consolidado ? todosItems : items;
  base = filtrarPorPessoa(base);

  const t = totaisPorTipo(base);
  // saldo = entradas - saidas (investimento NÃO afeta o saldo)
  const saldo = t.entrada - t.saida;

  const sa = document.getElementById('saldo-amount');
  sa.textContent = fmt(saldo);
  sa.className = 'amount ' + (saldo >= 0 ? 'pos' : 'neg');

  document.getElementById('entradas-amount').textContent = fmt(t.entrada);
  document.getElementById('saidas-amount').textContent = fmt(t.saida);

  // Card de investimentos:
  //  - número grande = patrimônio real informado (inclui rendimentos)
  //  - sub = rendimento líquido = patrimônio real - total aportado (todo histórico)
  const invAmount = document.getElementById('invest-amount');
  const invSub = document.getElementById('invest-sub');
  const aporte = t.investimento; // líquido do período (mês ou consolidado)
  if (patrimonio != null) {
    invAmount.textContent = fmt(patrimonio);
    const rendido = patrimonio - totalAportado;
    const positivo = rendido >= 0;
    const seta = positivo ? '↑' : '↓';
    const cor = positivo ? 'var(--green)' : 'var(--red)';
    invSub.innerHTML = `<span style="color:${cor};font-weight:600;">${seta} ${fmt(Math.abs(rendido))}</span> <span style="color:var(--muted2);">rendido</span>`;
  } else {
    // sem patrimônio informado: cai no aporte calculado e convida a informar o saldo real
    invAmount.textContent = fmt(aporte);
    invSub.textContent = 'Toque no lápis para informar o saldo real';
  }
}

function renderExtrato() {
  const el = document.getElementById('extrato-list');
  let base = filtrarPorPessoa(items);
  if (filtroTipo !== 'todos') base = base.filter(i => normTipo(i.tipo) === filtroTipo);
  if (base.length === 0) {
    el.innerHTML = '<div class="empty"><span>○</span>Nenhum lançamento neste mês.</div>';
    return;
  }
  el.innerHTML = base.map(i => {
    const tp = normTipo(i.tipo);
    const pessoa = i.pessoa || 'Franklin';
    const tag = pessoa === 'Airton' ? `<span class="tx-pessoa">${pessoa}</span>` : '';
    const neutra = ehNeutra(i);
    const estilo = neutra ? ' style="opacity:0.5;"' : '';
    const valStyle = neutra ? ' style="text-decoration:line-through;"' : '';
    const selo = neutra ? ' <span class="tx-pessoa" style="background:rgba(255,69,58,0.15);color:var(--red);">não conta</span>' : '';
    return `
    <div class="tx"${estilo}>
      <div class="tx-dot ${DOTCLASS[tp]}">${ICONS[tp]}</div>
      <div class="tx-body">
        <div class="tx-desc">${i.descricao}</div>
        <div class="tx-meta">${i.categoria}${tag}${selo}</div>
      </div>
      <div class="tx-right">
        <div class="tx-val ${DOTCLASS[tp]}"${valStyle}>${fmt(i.valor)}</div>
        <div class="tx-date">${dataFmt(i.criadoEm)}</div>
      </div>
      <button class="tx-del" onclick="delItem('${i.id}')" aria-label="Remover">×</button>
    </div>`;
  }).join('');
}

function renderCategoriasHome() {
  const el = document.getElementById('home-categorias');
  let base = consolidado ? todosItems : items;
  base = filtrarPorPessoa(base);

  const saidas = base.filter(i => normTipo(i.tipo) === 'saida' && !ehNeutra(i));
  const totalSaidas = saidas.reduce((s,i)=>s+num(i.valor),0);
  if (saidas.length === 0) { el.innerHTML = ''; return; }

  const porCat = {};
  saidas.forEach(i => { porCat[i.categoria] = (porCat[i.categoria]||0) + num(i.valor); });
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);

  el.innerHTML = `
    <div class="card">
      <div class="card-head"><span class="card-label">Saídas por categoria</span></div>
      ${cats.map(([cat,val])=>{
        const pct = totalSaidas>0 ? ((val/totalSaidas)*100).toFixed(0) : 0;
        return `<div style="padding:12px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;justify-content:space-between;font-size:15px;"><span>${cat}</span><span style="color:var(--red);font-weight:600;">${fmt(val)}</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:7px;"><div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div><span style="font-size:11px;color:var(--muted2);min-width:30px;">${pct}%</span></div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ===== NAV =====
window.setScreen = function(s, btn) {
  screenAtiva = s;
  ['home','extrato','add'].forEach(x => {
    document.getElementById('screen-'+x).classList.toggle('active', x===s);
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
};
window.setFiltroTipo = function(f, btn) {
  filtroTipo = f;
  document.querySelectorAll('#screen-extrato .chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderExtrato();
};

// ===== INIT =====
setTipo('saida');
setPessoaLanc('Franklin');
atualizarMesLabels();
Promise.all([carregarPatrimonio(), carregarTotalAportado()]).then(() => carregarItems());
</script>
